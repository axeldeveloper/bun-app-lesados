name: nextjs.auth
services:
    mysql:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: my766312
            #MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: nextauth
            MYSQL_USER: nestusr
            MYSQL_PASSWORD: 766312
            #MYSQL_ALLOW_EMPTY_PASSWORD: 1
            #MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'nest-mysql:/var/lib/mysql'
        networks:
            - nest_net
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'next-redis:/data'
        networks:
            - nest_net
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s

networks:
    nest_net:
        driver: bridge
volumes:
    nest-mysql:
        driver: local
    next-redis:
        driver: local
